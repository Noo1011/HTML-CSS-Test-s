
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
   
    <div class="container">

        <h2>Student Registration</h2>
        <p class="subtitle">Please fill in the form to register</p>

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Father's Name</label>
                <input type="text" placeholder="Enter father's name" required>
            </div>

            <div class="form-group">
                <label>Mother's Name</label>
                <input type="text" placeholder="Enter mother's name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>bc</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Present Address</label>
                <textarea rows="3" placeholder="Enter your address"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <select required>
                        <option value="">Select Department</option>
                        <option>CST</option>
                        <option>Civil</option>
                        <option>Electrical</option>
                        <option>Mechanical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" placeholder="Enter student ID" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

        </form>

    </div>

</body>
</html>
